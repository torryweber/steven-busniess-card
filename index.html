<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#81D8D0"
    >

    <meta
        name="description"
        content="Steven — GST Hardware Sdn Bhd digital business card"
    >

    <!-- Social Share Preview -->
    <meta
        property="og:title"
        content="Steven | GST Hardware"
    >

    <meta
        property="og:description"
        content="GST Hardware Sdn Bhd — Digital Business Card"
    >

    <meta
        property="og:image"
        content="https://torryweber.github.io/steven-busniess-card/gst-logo.png"
    >

    <meta
        property="og:url"
        content="https://torryweber.github.io/steven-busniess-card/"
    >

    <meta
        property="og:type"
        content="website"
    >

    <!-- Favicon -->
    <link
        rel="icon"
        href="favicon.ico"
    >

    <!-- Apple Icon -->
    <link
        rel="apple-touch-icon"
        href="icon-192.png"
    >

    <!-- PWA -->
    <link
        rel="manifest"
        href="manifest.json"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="styles.css"
    >

    <title>
        Steven | GST Hardware
    </title>

</head>


<body>

    <!-- Background Effects -->

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>


    <main class="shell">

        <section
            class="card"
            aria-label="Steven digital business card"
        >


            <!-- TOP BAR -->

            <div class="topbar">

                <span class="status">

                    <span class="dot"></span>

                    DIGITAL BUSINESS CARD

                </span>


                <button
                    class="icon-btn"
                    id="shareBtn"
                    aria-label="Share card"
                >

                    ↗

                </button>

            </div>



            <!-- GST LOGO -->

            <div class="brand">

                <div class="logo-wrap">

                    <img
                        src="gst-logo.png"
                        alt="GST Hardware logo"
                    >

                </div>

            </div>



            <!-- PERSON -->

            <div class="identity">

                <p class="eyebrow">

                    GST HARDWARE SDN BHD

                </p>


                <h1>

                    Steven

                </h1>


                <p class="sub">

                    GST Hardware Sdn Bhd

                </p>

            </div>



            <!-- MAIN ACTION BUTTONS -->

            <div class="actions">


                <!-- CALL -->

                <a
                    class="action primary"
                    href="tel:+60122601271"
                >

                    <span class="action-icon">

                        ☎

                    </span>

                    <span>

                        Call

                    </span>

                </a>



                <!-- WHATSAPP -->

                <a
                    class="action"
                    href="https://wa.me/60122601271"
                    target="_blank"
                    rel="noopener"
                >

                    <span class="action-icon">

                        ◉

                    </span>

                    <span>

                        WhatsApp

                    </span>

                </a>



                <!-- EMAIL -->

                <a
                    class="action"
                    href="mailto:sales@gsthardware.com.my"
                >

                    <span class="action-icon">

                        ✉

                    </span>

                    <span>

                        Email

                    </span>

                </a>



                <!-- SAVE CONTACT -->

                <button
                    class="action"
                    id="saveContact"
                >

                    <span class="action-icon">

                        ＋

                    </span>

                    <span>

                        Save Contact

                    </span>

                </button>


            </div>



            <!-- LOCATIONS -->

            <div class="locations">


                <!-- HQ -->

                <a
                    class="location"
                    href="https://maps.app.goo.gl/nDFQUn5WBUXVwfFi8"
                    target="_blank"
                    rel="noopener"
                >

                    <span class="location-icon">

                        ⌖

                    </span>


                    <span>

                        <b>

                            HQ

                        </b>


                        <small>

                            Open in Google Maps

                        </small>

                    </span>


                    <span class="arrow">

                        ›

                    </span>

                </a>



                <!-- WAREHOUSE -->

                <a
                    class="location"
                    href="https://maps.app.goo.gl/uCktaW93jbhAB3oD8"
                    target="_blank"
                    rel="noopener"
                >

                    <span class="location-icon">

                        ⌖

                    </span>


                    <span>

                        <b>

                            Warehouse

                        </b>


                        <small>

                            Open in Google Maps

                        </small>

                    </span>


                    <span class="arrow">

                        ›

                    </span>

                </a>


            </div>



            <!-- WEBSITE -->

            <a
                class="website"
                href="https://www.gsthardware.com.my/"
                target="_blank"
                rel="noopener"
            >

                <span>

                    gsthardware.com.my

                </span>


                <span>

                    ↗

                </span>

            </a>



            <!-- FOOTER -->

            <p class="footer">

                GST Hardware · Since 1999

            </p>


        </section>

    </main>



    <!-- Toast Notification -->

    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>



    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
